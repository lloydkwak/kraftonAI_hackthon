[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usvsim"
version = "0.6.2"
description = "Track 2 USV simulation kit: the public plant and its logs (2-1); the camera, the closed-loop recorder, the dataset format and the fixed learner (2-2)"
requires-python = ">=3.10"

# numpy is all the kit needs. A 2-1 submission may also import scipy and pillow at scoring time (docs/RUNTIME.md).
# The 2-2 modules, the validator included, need numpy only; only the fixed learner needs torch.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
learner = ["torch>=2.0"]

[project.scripts]
usvsim = "usvsim.cli:main"

[tool.setuptools]
packages = ["usvsim", "usvsim.guide"]

[tool.setuptools.package-data]
usvsim = ["params.json"]
